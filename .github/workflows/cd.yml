name: Product Management CD

on:
  workflow_run:
    workflows:
      - Product Management CI
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:

      # =========================================================
      # DOWNLOAD ARTIFACT
      # =========================================================

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ProductManagement-Publish
          path: ./publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # =========================================================
      # CHECK FILES
      # =========================================================

      - name: Check downloaded files
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Downloaded files"
          Write-Host "======================================"

          Get-ChildItem -Path ".\publish" -Recurse

      # =========================================================
      # STOP IIS APPLICATION POOLS
      # =========================================================

      - name: Stop IIS Application Pools
        shell: powershell
        run: |

          Import-Module WebAdministration

          $apiPool = "ProductManagement.API"
          $uiPool  = "ProductManagement.UI"

          Write-Host "======================================"
          Write-Host "Stopping IIS Application Pools"
          Write-Host "======================================"

          # -----------------------------
          # API APP POOL
          # -----------------------------

          if (Test-Path "IIS:\AppPools\$apiPool") {

              $apiState = (Get-WebAppPoolState -Name $apiPool).Value

              Write-Host "API App Pool: $apiPool"
              Write-Host "Current State: $apiState"

              if ($apiState -ne "Stopped") {

                  Write-Host "Stopping API App Pool..."

                  Stop-WebAppPool -Name $apiPool
              }
              else {

                  Write-Host "API App Pool is already stopped."
              }
          }
          else {

              Write-Host "API App Pool not found: $apiPool"
          }

          # -----------------------------
          # UI APP POOL
          # -----------------------------

          if (Test-Path "IIS:\AppPools\$uiPool") {

              $uiState = (Get-WebAppPoolState -Name $uiPool).Value

              Write-Host "UI App Pool: $uiPool"
              Write-Host "Current State: $uiState"

              if ($uiState -ne "Stopped") {

                  Write-Host "Stopping UI App Pool..."

                  Stop-WebAppPool -Name $uiPool
              }
              else {

                  Write-Host "UI App Pool is already stopped."
              }
          }
          else {

              Write-Host "UI App Pool not found: $uiPool"
          }

          Write-Host ""
          Write-Host "Waiting for IIS App Pools to stop..."

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "Current App Pool States:"

          Get-WebAppPoolState -Name $apiPool
          Get-WebAppPoolState -Name $uiPool

      # =========================================================
      # CREATE APP_OFFLINE FILES
      # =========================================================

      - name: Take Applications Offline
        shell: powershell
        run: |

          $apiDestination = "C:\IIS\Product\API"
          $uiDestination  = "C:\IIS\Product\UI"

          Write-Host "======================================"
          Write-Host "Taking applications offline"
          Write-Host "======================================"

          # API directory

          if (!(Test-Path $apiDestination)) {

              New-Item `
                -ItemType Directory `
                -Path $apiDestination `
                -Force | Out-Null
          }

          # UI directory

          if (!(Test-Path $uiDestination)) {

              New-Item `
                -ItemType Directory `
                -Path $uiDestination `
                -Force | Out-Null
          }

          # API app_offline

          Write-Host "Creating API app_offline.htm"

          Set-Content `
            -Path "$apiDestination\app_offline.htm" `
            -Value "<html><body>Application deployment in progress.</body></html>" `
            -Force

          # UI app_offline

          Write-Host "Creating UI app_offline.htm"

          Set-Content `
            -Path "$uiDestination\app_offline.htm" `
            -Value "<html><body>Application deployment in progress.</body></html>" `
            -Force

          Write-Host "Waiting for IIS to release application files..."

          Start-Sleep -Seconds 5

      # =========================================================
      # WAIT FOR IIS WORKER PROCESSES
      # =========================================================

      - name: Wait for IIS Worker Processes
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Checking IIS Worker Processes"
          Write-Host "======================================"

          $maxWait = 30
          $elapsed = 0

          while ($elapsed -lt $maxWait) {

              $processes = Get-Process w3wp -ErrorAction SilentlyContinue

              if ($null -eq $processes) {

                  Write-Host "No IIS worker processes are running."

                  break
              }

              Write-Host "IIS worker process(es) still running:"
              $processes | Select-Object Id, ProcessName

              Start-Sleep -Seconds 2

              $elapsed += 2
          }

          Write-Host ""
          Write-Host "Finished waiting for IIS worker processes."

      # =========================================================
      # DEPLOY API
      # =========================================================

      - name: Deploy API
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Deploying API"
          Write-Host "======================================"

          $source = ".\publish\API"
          $destination = "C:\IIS\Product\API"

          if (!(Test-Path $source)) {

              throw "API publish folder not found: $source"
          }

          if (!(Test-Path $destination)) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force | Out-Null
          }

          Copy-Item `
            "$source\*" `
            $destination `
            -Recurse `
            -Force

          Write-Host "API deployed successfully."

      # =========================================================
      # DEPLOY UI
      # =========================================================

      - name: Deploy UI
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Deploying UI"
          Write-Host "======================================"

          $source = ".\publish\UI"
          $destination = "C:\IIS\Product\UI"

          if (!(Test-Path $source)) {

              throw "UI publish folder not found: $source"
          }

          if (!(Test-Path $destination)) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force | Out-Null
          }

          Write-Host "Copying UI files..."

          Copy-Item `
            "$source\*" `
            $destination `
            -Recurse `
            -Force

          Write-Host "UI deployed successfully."

      # =========================================================
      # REMOVE APP_OFFLINE
      # =========================================================

      - name: Remove app_offline files
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Removing app_offline.htm"
          Write-Host "======================================"

          $apiOffline = "C:\IIS\Product\API\app_offline.htm"
          $uiOffline  = "C:\IIS\Product\UI\app_offline.htm"

          if (Test-Path $apiOffline) {

              Remove-Item `
                $apiOffline `
                -Force
          }

          if (Test-Path $uiOffline) {

              Remove-Item `
                $uiOffline `
                -Force
          }

          Write-Host "app_offline.htm files removed."

      # =========================================================
      # START IIS APPLICATION POOLS
      # =========================================================

      - name: Start IIS Application Pools
        shell: powershell
        run: |

          Import-Module WebAdministration

          $apiPool = "ProductManagement.API"
          $uiPool  = "ProductManagement.UI"

          Write-Host "======================================"
          Write-Host "Starting IIS Application Pools"
          Write-Host "======================================"

          # -----------------------------
          # API
          # -----------------------------

          if (Test-Path "IIS:\AppPools\$apiPool") {

              $apiState = (Get-WebAppPoolState -Name $apiPool).Value

              Write-Host "API Current State: $apiState"

              if ($apiState -eq "Stopped") {

                  Write-Host "Starting API App Pool..."

                  Start-WebAppPool -Name $apiPool
              }
              else {

                  Write-Host "API App Pool is already running."
              }
          }

          # -----------------------------
          # UI
          # -----------------------------

          if (Test-Path "IIS:\AppPools\$uiPool") {

              $uiState = (Get-WebAppPoolState -Name $uiPool).Value

              Write-Host "UI Current State: $uiState"

              if ($uiState -eq "Stopped") {

                  Write-Host "Starting UI App Pool..."

                  Start-WebAppPool -Name $uiPool
              }
              else {

                  Write-Host "UI App Pool is already running."
              }
          }

          Write-Host ""
          Write-Host "IIS Application Pools started."

      # =========================================================
      # VERIFY APP POOLS
      # =========================================================

      - name: Verify IIS Application Pools
        shell: powershell
        run: |

          Import-Module WebAdministration

          $apiPool = "ProductManagement.API"
          $uiPool  = "ProductManagement.UI"

          Write-Host "======================================"
          Write-Host "Verifying IIS Application Pools"
          Write-Host "======================================"

          $apiState = (Get-WebAppPoolState -Name $apiPool).Value
          $uiState  = (Get-WebAppPoolState -Name $uiPool).Value

          Write-Host "API App Pool: $apiState"
          Write-Host "UI App Pool : $uiState"

          if ($apiState -ne "Started") {

              throw "API App Pool is not started."
          }

          if ($uiState -ne "Started") {

              throw "UI App Pool is not started."
          }

          Write-Host "Both App Pools are running successfully."

      # =========================================================
      # VERIFY DEPLOYMENT
      # =========================================================

      - name: Verify deployment
        shell: powershell
        run: |

          Write-Host "======================================"
          Write-Host "Checking API deployment"
          Write-Host "======================================"

          if (!(Test-Path "C:\IIS\Product\API\ProductManagement.API.dll")) {

              throw "API DLL not found after deployment."
          }

          Get-ChildItem "C:\IIS\Product\API"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Checking UI deployment"
          Write-Host "======================================"

          if (!(Test-Path "C:\IIS\Product\UI\ProductManagement.UI.dll")) {

              throw "UI DLL not found after deployment."
          }

          Get-ChildItem "C:\IIS\Product\UI"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENT COMPLETED SUCCESSFULLY"
          Write-Host "======================================"
