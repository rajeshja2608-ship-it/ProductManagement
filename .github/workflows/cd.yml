name: Product Management CD

on:
  workflow_run:
    workflows:
      - Product Management CI
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ProductManagement-Publish
          path: ./publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check downloaded files
        shell: powershell
        run: |
          Write-Host "Downloaded files:"
          Get-ChildItem -Path "./publish" -Recurse

      - name: Deploy API
        shell: powershell
        run: |
          Write-Host "Deploying API..."

          # We will configure IIS here after confirming
          # artifact download is working.

      - name: Deploy UI
        shell: powershell
        run: |
          Write-Host "Deploying UI..."

          # We will configure IIS here after confirming
          # artifact download is working.

      - name: Verify deployment
        shell: powershell
        run: |
          Write-Host "Deployment workflow completed."
