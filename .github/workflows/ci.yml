name: Product Management CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-publish:

    name: Build, Test and Publish

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v6


      # 2. Install .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # 3. Restore
      - name: Restore dependencies
        run: dotnet restore ProductManagement.sln


      # 4. Build
      - name: Build solution
        run: >
          dotnet build ProductManagement.sln
          --configuration Release
          --no-restore


      # 5. Run Unit Tests
      - name: Run unit tests
        run: >
          dotnet test ProductManagement.Tests/ProductManagement.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults


      # 6. Publish API
      - name: Publish API
        run: >
          dotnet publish ProductManagement.API/ProductManagement.API.csproj
          --configuration Release
          --output ./publish/API
          --no-restore


      # 7. Publish UI
      - name: Publish UI
        run: >
          dotnet publish ProductManagement.UI/ProductManagement.UI.csproj
          --configuration Release
          --output ./publish/UI
          --no-restore


      # 8. Upload Published Application
      - name: Upload publish files
        uses: actions/upload-artifact@v4
        with:
          name: ProductManagement-Publish
          path: publish/


      # 9. Upload Test Results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Results
          path: TestResults/
